# =============================================
# Robo 001 - commits diarios no repo daily-log (modo CLOUD).
#
# A trava "um lote por dia" fica no Supabase (public.historico_cargas): a
# maquina do Actions nasce vazia a cada execucao, nada local serve de memoria.
# =============================================
name: robo_001_check_github

on:
  # Todo dia as 07:00 de Sao Paulo (10:00 UTC), disparado pelo pg_cron do
  # Supabase (migration 20261027233340_robos_disparo_pg_cron). O schedule do
  # GitHub atrasava 2 a 7 h. 10:00 UTC fica longe da virada do dia UTC, que e o
  # quadradinho do calendario. Sem disparo, o vigia de reserva avisa.
  workflow_dispatch:

concurrency:
  group: robo-001
  cancel-in-progress: false

jobs:
  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MODO_EXECUCAO: CLOUD
      # Token com escrita no repo daily-log. Secret nao pode comecar com
      # GITHUB_, por isso GH_PAT (o robo le GH_PAT antes de GITHUB_TOKEN).
      GH_PAT: ${{ secrets.GH_PAT }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Commits do dia
        run: python automacoes/001_check_github/001_check_github.py

      - name: Guardar o log do erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-erro-001
          path: automacoes/001_check_github/temp/erro_*.txt
          if-no-files-found: ignore
