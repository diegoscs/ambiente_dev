# =============================================
# Vigia dos robos: le a vw_saude_robos e falha se algum robo estiver com
# ERRO, ATRASADO, TRAVADO ou NUNCA_RODOU.
#
# Run vermelho = e-mail do GitHub para quem mexeu no cron por ultimo (e alerta
# no Telegram, se os secrets existirem). E o que transforma "o robo nem rodou"
# em aviso, sem depender de alguem abrir o hub.
# =============================================
name: vigia_robos

on:
  # O vigia de verdade sai as 09:00 de Sao Paulo (12:00 UTC), disparado pelo
  # pg_cron do Supabase depois de todos os robos da manha.
  #
  # Este schedule e a RESERVA (--reserva), independente do Supabase: se o vigia
  # das 09:00 ja passou no dia, ele sai sem gravar nada; se nao passou, o
  # disparo falhou (token vencido, Supabase fora) e ele avisa. Marcado para
  # 12:00 SP; com o atraso do GitHub, roda na tarde.
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

# Token do Actions so com leitura (checkout). Escrita fora daqui usa
# secret proprio (GH_PAT, Supabase), nunca o GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Conferir a saude dos robos
        run: python automacoes/vigia_robos.py ${{ github.event_name == 'schedule' && '--reserva' || '' }}
