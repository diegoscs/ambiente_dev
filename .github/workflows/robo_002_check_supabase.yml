# =============================================
# Robo 002 - keepalive do projeto Supabase (modo CLOUD).
#
# O plano free pausa o projeto depois de ~7 dias sem atividade. Rodando todo
# dia aqui, a pausa so acontece se o workflow falhar uma semana inteira - e o
# hub mostra ATRASADO bem antes disso.
#
# Sem Postgres local: o status e o historico vao direto para o Supabase
# (public.controle_cargas e public.historico_cargas).
# =============================================
name: robo_002_check_supabase

on:
  # Todo dia as 08:00 de Sao Paulo (11:00 UTC), disparado pelo pg_cron do
  # Supabase (migration 20261027233340_robos_disparo_pg_cron). O schedule do
  # GitHub atrasava 2 a 7 h. Sem disparo, o vigia de reserva avisa.
  workflow_dispatch:

# Duas execucoes simultaneas gravariam na mesma linha de controle.
# Token do Actions so com leitura (checkout). Escrita fora daqui usa
# secret proprio (GH_PAT, Supabase), nunca o GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: robo-002
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MODO_EXECUCAO: CLOUD
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ping no Supabase
        run: python automacoes/002_check_supabase/002_check_supabase.py

      - name: Guardar o log do erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-erro-002
          path: automacoes/002_check_supabase/temp/erro_*.txt
          if-no-files-found: ignore
