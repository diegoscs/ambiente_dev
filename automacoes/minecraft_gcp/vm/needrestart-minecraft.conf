# Nao reiniciar o servidor de Minecraft sozinho depois de atualizacao automatica.
# Em 21/10/2026 o unattended-upgrades atualizou a liblzma5 as 21:40 e o
# needrestart reiniciou o minecraft.service no meio do jogo, derrubando todo
# mundo. A biblioteca nova passa a valer no proximo start do servidor (a VM
# desliga quando todos saem, entao isso acontece quase todo dia).
# Instalado em /etc/needrestart/conf.d/ pelo instalar_monitor.sh.
$nrconf{override_rc}{qr(^minecraft\.service$)} = 0;
$nrconf{override_rc}{qr(^monitor-minecraft\.service$)} = 0;
