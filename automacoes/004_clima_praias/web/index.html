<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sol nas Praias</title>
<!-- Template do robo 004: o report.py troca null pelo JSON da previsao.
     Unica dependencia externa: Leaflet + mapa de fundo da Esri, so no card do
     mapa. Sem internet o resto da pagina funciona e o card some. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  color-scheme:light;
  --pagina:#f9f9f7; --superficie:#fcfcfb; --tinta:#0b0b0b; --tinta-2:#52514e; --muted:#898781;
  --grade:#e1e0d9; --eixo:#c3c2b7; --borda:rgba(11,11,11,.10); --hover:rgba(11,11,11,.04);
  --serie:#2a78d6; --faixa-praia:rgba(42,120,214,.08); --selecao:#0b0b0b;
  --sol:#0ca30c; --nublado:#fab219; --chuva:#d03b3b;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --pagina:#0d0d0d; --superficie:#1a1a19; --tinta:#f0efec; --tinta-2:#c3c2b7; --muted:#898781;
    --grade:#2c2c2a; --eixo:#383835; --borda:rgba(255,255,255,.10); --hover:rgba(255,255,255,.05);
    --serie:#3987e5; --faixa-praia:rgba(57,135,229,.12); --selecao:#f0efec;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --pagina:#0d0d0d; --superficie:#1a1a19; --tinta:#f0efec; --tinta-2:#c3c2b7; --muted:#898781;
  --grade:#2c2c2a; --eixo:#383835; --borda:rgba(255,255,255,.10); --hover:rgba(255,255,255,.05);
  --serie:#3987e5; --faixa-praia:rgba(57,135,229,.12); --selecao:#f0efec;
}
*{box-sizing:border-box}
body{margin:0;background:var(--pagina);color:var(--tinta);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.45rem;margin:0}
.sub{margin:4px 0 0;color:var(--tinta-2);font-size:.9rem}

/* semana: um bloco por dia, melhor nota do dia */
.semana{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin:18px 0 6px}
.dia{all:unset;box-sizing:border-box;cursor:pointer;background:var(--superficie);
  border:1px solid var(--borda);border-top:4px solid var(--c);border-radius:12px;
  padding:8px 12px 10px;display:flex;flex-direction:column;gap:1px}
.dia:hover{background:var(--hover)}
.dia[aria-pressed="true"]{box-shadow:0 0 0 2px var(--selecao)}
.dia:focus-visible,.grupo:focus-visible{outline:2px solid var(--serie);outline-offset:2px}
.dia .sem{font-size:.8rem;color:var(--tinta-2)}
.dia .nota{font-size:1.7rem;font-weight:700;line-height:1.15}
.rotulo{font-size:.78rem;color:var(--tinta-2);white-space:nowrap}

.card{background:var(--superficie);border:1px solid var(--borda);border-radius:14px;padding:16px;margin-top:14px}
h2{font-size:1.15rem;margin:0}
#titulo-dia{text-transform:capitalize}
.resumo{color:var(--tinta-2);margin:4px 0 12px;font-size:.92rem}
.resumo b{color:var(--tinta)}

/* ranking: um botao por grupo de previsao */
.grupo{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:5px;width:100%;
  padding:10px 12px;border-radius:10px}
.grupo + .grupo{margin-top:2px}
.grupo:hover{background:var(--hover)}
.grupo[aria-pressed="true"]{background:var(--hover);box-shadow:inset 3px 0 0 var(--serie)}
.nomes{font-size:.92rem;font-weight:600}
.linha-barra{display:grid;grid-template-columns:1fr 34px;align-items:center;gap:10px}
.trilho{height:8px;background:var(--grade);border-radius:4px}
.barra{display:block;height:100%;border-radius:4px;background:var(--c)}
.valor{font-weight:700;text-align:right}
.meta{font-size:.8rem;color:var(--muted)}

/* graficos hora a hora */
.dica{color:var(--tinta-2);font-size:.88rem;margin:4px 0 12px}
.legenda-faixa{display:inline-block;width:14px;height:10px;border-radius:2px;background:var(--faixa-praia);
  border:1px solid var(--borda);vertical-align:-1px;margin-right:4px}
.graficos{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px 20px}
.grafico h3{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;font-weight:600;
  color:var(--tinta-2);margin:0 0 4px}
.leitura{color:var(--tinta);font-weight:600;font-variant-numeric:tabular-nums}
.plot svg{display:block;touch-action:pan-y}
.plot text{font:10px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--muted);font-variant-numeric:tabular-nums}

/* mapa de chuva */
.controles{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.botao{all:unset;box-sizing:border-box;cursor:pointer;min-width:36px;height:32px;padding:0 10px;
  display:inline-flex;align-items:center;justify-content:center;border-radius:8px;
  border:1px solid var(--borda);font-size:.85rem;color:var(--tinta)}
.botao:hover{background:var(--hover)}
.botao[aria-pressed="true"]{background:var(--tinta);color:var(--superficie);border-color:var(--tinta)}
.botao:focus-visible{outline:2px solid var(--serie);outline-offset:2px}
.alternar{display:inline-flex;gap:4px;margin-left:auto}
#hora{flex:1;min-width:120px;accent-color:var(--serie)}
#hora-rotulo{min-width:34px;text-align:right}
#mapa{height:360px;border-radius:10px;border:1px solid var(--borda);background:var(--grade)}
@media (max-width:520px){#mapa{height:300px}}
.legenda-mapa{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:.78rem;color:var(--tinta-2)}
.legenda-mapa i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;
  border:1px solid var(--borda)}
.leaflet-tooltip{font:12px system-ui,-apple-system,"Segoe UI",sans-serif}

details summary{cursor:pointer;font-weight:600;font-size:.92rem}
.tabela{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:.85rem;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--grade);text-align:right;white-space:nowrap}
th{color:var(--tinta-2);font-weight:600}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
footer{color:var(--muted);font-size:.8rem;margin-top:18px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="titulo"></h1>
    <p class="sub" id="periodo"></p>
  </header>

  <nav class="semana" id="semana" aria-label="Escolha o dia"></nav>

  <section class="card">
    <h2 id="titulo-dia"></h2>
    <p class="resumo" id="resumo-dia"></p>
    <div id="ranking"></div>
  </section>

  <section class="card" id="card-mapa">
    <h2>Onde vai chover</h2>
    <p class="dica">Chuva prevista pelo modelo no dia escolhido, em blocos de ~5 km. Não é radar: é previsão,
      e o modelo não enxerga detalhe menor que ~10–25 km. Os pontos são as praias, na cor da nota do dia.</p>
    <div class="controles">
      <button class="botao" id="tocar" aria-label="Animar as horas">▶</button>
      <input type="range" id="hora" min="0" max="13" step="1" aria-label="Hora do mapa">
      <span class="leitura" id="hora-rotulo"></span>
      <span class="alternar" role="group" aria-label="O que mostrar">
        <button class="botao" data-metrica="mm" aria-pressed="true">mm</button>
        <button class="botao" data-metrica="prob" aria-pressed="false">chance</button>
      </span>
    </div>
    <div id="mapa"></div>
    <div class="legenda-mapa" id="legenda-mapa"></div>
  </section>

  <section class="card">
    <h2>Hora a hora</h2>
    <p class="dica" id="dica-graficos"></p>
    <div class="graficos" id="graficos"></div>
  </section>

  <section class="card">
    <details>
      <summary>Tabela com todas as praias</summary>
      <div class="tabela" id="tabela"></div>
    </details>
  </section>

  <footer id="rodape"></footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Ou os dados vem embutidos (ranking.html do run, abre offline), ou a pagina
// e o app publico e busca o pacote em public.painel_praias ao abrir.
let D = null;
const FONTE = {"url": "https://mthipdxpedlfnkzddlar.supabase.co", "chave": "sb_publishable_Y3utSlAXuOl3vzrMeJWr1Q_Rq6Xbz-D", "cidade": "Ubatuba"};

const FAIXA = {
  sol:     {rotulo: "sol",     icone: "☀️", cor: "var(--sol)"},
  nublado: {rotulo: "nublado", icone: "⛅", cor: "var(--nublado)"},
  chuva:   {rotulo: "chuva",   icone: "🌧️", cor: "var(--chuva)"},
};
const JANELA = [9, 17];  // horario de praia, [inicio, fim)

const soma = v => v.reduce((a, b) => a + b, 0);
const media = v => v.length ? soma(v) / v.length : null;
const MEDIDAS = [
  {k: "chuva_prob", titulo: "Chance de chuva", un: "%",     tipo: "barra", max: () => 100,
   resumo: v => `máx ${Math.round(Math.max(...v))}%`},
  {k: "chuva_mm",   titulo: "Chuva",           un: " mm",   tipo: "barra", casas: 1, max: v => Math.max(2, ...v),
   resumo: v => `total ${soma(v).toFixed(1)} mm`},
  {k: "nuvens",     titulo: "Nuvens",          un: "%",     tipo: "linha", max: () => 100,
   resumo: v => `média ${Math.round(media(v))}%`},
  {k: "temp",       titulo: "Temperatura",     un: "°",     tipo: "linha",
   min: v => Math.floor(Math.min(...v)) - 1, max: v => Math.ceil(Math.max(...v)) + 1,
   resumo: v => `máx ${Math.round(Math.max(...v))}°`},
  {k: "vento",      titulo: "Vento",           un: " km/h", tipo: "linha", max: v => Math.max(20, ...v),
   resumo: v => `média ${Math.round(media(v))} km/h`},
  {k: "uv",         titulo: "Índice UV",       un: "",      tipo: "barra", max: v => Math.max(8, ...v),
   resumo: v => `máx ${Math.round(Math.max(...v))}`},
];

let diaSel = 0, grupoSel = 0;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const fmt = (v, un = "", casas = 0) => v == null ? "–" : `${Number(v).toFixed(casas)}${un}`;
const nomes = g => g.praias.map(p => p.nome);
function nomesCurto(g, n = 2) {
  const ns = nomes(g);
  return ns.length <= n ? ns.join(" e ") : `${ns.slice(0, n).join(", ")} e mais ${ns.length - n}`;
}

// ─── semana ───────────────────────────────────────────────────────────────
function renderSemana() {
  $("#semana").innerHTML = D.dias.map((d, i) => {
    const g = d.grupos[0], f = FAIXA[g.faixa];
    return `<button class="dia" data-i="${i}" aria-pressed="${i === diaSel}" style="--c:${f.cor}">
      <span class="sem">${d.semana.slice(0, 3)} ${d.dm}</span>
      <span class="nota">${g.score}</span>
      <span class="rotulo">${f.icone} ${f.rotulo}</span></button>`;
  }).join("");
}

// ─── dia: resumo e ranking ────────────────────────────────────────────────
function renderDia() {
  const d = D.dias[diaSel], melhor = d.grupos[0], pior = d.grupos[d.grupos.length - 1];
  $("#titulo-dia").textContent = `${d.semana}, ${d.dm}`;
  $("#resumo-dia").innerHTML = d.amplitude < D.amplitude_relevante
    ? `Previsão parecida na cidade toda: ${d.amplitude} pts entre a melhor e a pior praia. ${FAIXA[melhor.faixa].icone} ${FAIXA[melhor.faixa].rotulo} em todo lugar.`
    : `Melhor: <b>${esc(nomesCurto(melhor))}</b> (${melhor.score}). Evite: <b>${esc(nomesCurto(pior))}</b> (${pior.score}).`;
  $("#ranking").innerHTML = d.grupos.map((g, i) => {
    const f = FAIXA[g.faixa];
    return `<button class="grupo" data-i="${i}" aria-pressed="${i === grupoSel}">
      <span class="nomes">${nomes(g).map(esc).join(" · ")}</span>
      <span class="linha-barra"><span class="trilho"><span class="barra" style="width:${g.score}%;--c:${f.cor}"></span></span>
        <span class="valor">${g.score}</span></span>
      <span class="meta">${f.icone} ${f.rotulo} · manhã ${fmt(g.manha)} · tarde ${fmt(g.tarde)} · chuva até ${fmt(g.chuva_prob_max, "%")} · ${fmt(g.temp_max, "°")}</span>
    </button>`;
  }).join("");
  renderGraficos();
  renderTabela();
  pintarMapa();
}

// ─── graficos ─────────────────────────────────────────────────────────────
function caminhoBarra(x0, w, topo, base, r) {
  r = Math.min(r, w / 2, base - topo);
  return `M${x0},${base}V${topo + r}Q${x0},${topo} ${x0 + r},${topo}H${x0 + w - r}Q${x0 + w},${topo} ${x0 + w},${topo + r}V${base}Z`;
}

function desenhar(el, m, horas, valores) {
  const W = Math.max(240, el.clientWidth), H = 132, ml = 32, mr = 6, mt = 8, mb = 20;
  const pw = W - ml - mr, ph = H - mt - mb, passo = pw / horas.length;
  const vs = valores.filter(v => v != null);
  const lo = m.min ? m.min(vs) : 0, hi = Math.max(m.max(vs), lo + 1);
  const y = v => mt + ph - (v - lo) / (hi - lo) * ph;
  const x = i => ml + passo * i + passo / 2;
  const base = mt + ph;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${m.titulo} hora a hora">`;

  const i0 = horas.indexOf(JANELA[0]), i1 = horas.indexOf(JANELA[1] - 1);
  if (i0 >= 0 && i1 >= 0)
    s += `<rect x="${ml + passo * i0}" y="${mt}" width="${passo * (i1 - i0 + 1)}" height="${ph}" fill="var(--faixa-praia)"/>`;

  for (const v of [lo, (lo + hi) / 2, hi]) {
    s += `<line x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grade)"/>`;
    s += `<text x="${ml - 6}" y="${y(v) + 3}" text-anchor="end">${Number(v.toFixed(m.casas || 0))}</text>`;
  }
  s += `<line x1="${ml}" x2="${W - mr}" y1="${base}" y2="${base}" stroke="var(--eixo)"/>`;
  horas.forEach((h, i) => {
    if (h % 3 === 0) s += `<text x="${x(i)}" y="${H - 5}" text-anchor="middle">${h}h</text>`;
  });

  if (m.tipo === "barra") {
    const bw = Math.max(2, passo - 2);
    valores.forEach((v, i) => {
      if (v == null || v <= lo) return;
      s += `<path d="${caminhoBarra(x(i) - bw / 2, bw, y(v), base, 4)}" fill="var(--serie)"/>`;
    });
  } else {
    let d = "", aberto = false;
    valores.forEach((v, i) => {
      if (v == null) { aberto = false; return; }
      d += `${aberto ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`;
      aberto = true;
    });
    s += `<path d="${d}" fill="none" stroke="var(--serie)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }

  s += `<line class="cursor" y1="${mt}" y2="${base}" stroke="var(--tinta-2)" stroke-width="1" visibility="hidden"/>`;
  s += `<circle class="marca" r="4" fill="var(--serie)" stroke="var(--superficie)" stroke-width="2" visibility="hidden"/>`;
  s += `<rect class="alvo" x="${ml}" y="0" width="${pw}" height="${H}" fill="transparent"/>`;
  el.innerHTML = s + "</svg>";
  el._geo = {x, y, ml, passo, n: horas.length};
}

function grupoAtual() { return D.dias[diaSel].grupos[grupoSel]; }

function renderGraficos() {
  const g = grupoAtual();
  $("#dica-graficos").innerHTML =
    `Em <b>${esc(nomesCurto(g, 3))}</b>. Toque numa linha do ranking para trocar. ` +
    `<span class="legenda-faixa"></span>horário de praia (9h–17h).`;
  $("#graficos").innerHTML = MEDIDAS.map((m, i) =>
    `<div class="grafico" data-m="${i}"><h3><span>${m.titulo}</span><span class="leitura"></span></h3>
     <div class="plot"></div></div>`).join("");
  document.querySelectorAll(".grafico").forEach(el => {
    const m = MEDIDAS[el.dataset.m];
    desenhar(el.querySelector(".plot"), m, g.horas.h, g.horas[m.k]);
  });
  marcarHora(null);
}

// Uma hora destacada em todos os graficos ao mesmo tempo.
function marcarHora(idx) {
  const g = grupoAtual();
  document.querySelectorAll(".grafico").forEach(el => {
    const m = MEDIDAS[el.dataset.m], valores = g.horas[m.k], geo = el.querySelector(".plot")._geo;
    const cursor = el.querySelector(".cursor"), marca = el.querySelector(".marca"), leitura = el.querySelector(".leitura");
    if (idx == null) {
      cursor.setAttribute("visibility", "hidden");
      marca.setAttribute("visibility", "hidden");
      const naJanela = valores.filter((v, i) => v != null && g.horas.h[i] >= JANELA[0] && g.horas.h[i] < JANELA[1]);
      leitura.textContent = naJanela.length ? `${m.resumo(naJanela)} (9h–17h)` : "–";
      return;
    }
    const v = valores[idx], cx = geo.x(idx);
    cursor.setAttribute("x1", cx); cursor.setAttribute("x2", cx); cursor.setAttribute("visibility", "visible");
    if (v != null) {
      marca.setAttribute("cx", cx); marca.setAttribute("cy", geo.y(v)); marca.setAttribute("visibility", "visible");
    } else marca.setAttribute("visibility", "hidden");
    leitura.textContent = `${g.horas.h[idx]}h · ${fmt(v, m.un, m.casas || 0)}`;
  });
}

function horaDoPonteiro(e) {
  const plot = e.target.closest(".plot");
  if (!plot || !plot._geo) return null;
  const geo = plot._geo, px = e.clientX - plot.getBoundingClientRect().left;
  return Math.min(geo.n - 1, Math.max(0, Math.floor((px - geo.ml) / geo.passo)));
}

// ─── mapa de chuva ────────────────────────────────────────────────────────
// Hex (e nao var()): o Leaflet grava a cor como atributo do SVG.
const COR_FAIXA = {sol: "#0ca30c", nublado: "#fab219", chuva: "#d03b3b"};
// Sequencial em um tom so (azul): mais chuva, mais escuro.
const ESCALAS = {
  mm:   {titulo: "mm na última hora:", limites: [0.1, 0.5, 1, 2, 5],
         cores: ["#b7d3f6", "#86b6ef", "#3987e5", "#1c5cab", "#0d366b"],
         rotulos: ["0,1–0,5", "0,5–1", "1–2", "2–5", "5 ou mais"]},
  prob: {titulo: "Chance de chuva:", limites: [20, 40, 60, 80],
         cores: ["#b7d3f6", "#6da7ec", "#256abf", "#0d366b"],
         rotulos: ["20–40%", "40–60%", "60–80%", "80% ou mais"]},
};
let mapa = null, celulas = [], marcadores = [], metrica = "mm", horaMapa = null, animacao = null;

function corDaChuva(v) {
  const e = ESCALAS[metrica];
  if (v == null || v < e.limites[0]) return null;
  let i = 0;
  while (i + 1 < e.limites.length && v >= e.limites[i + 1]) i++;
  return e.cores[i];
}

function iniciarMapa() {
  if (!D.mapa || typeof L === "undefined") { $("#card-mapa").hidden = true; return; }
  const tema = document.documentElement.dataset.theme;
  const escuro = tema === "dark" || (tema !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  mapa = L.map("mapa", {scrollWheelZoom: false, zoomSnap: 0.5});
  // Fundo cinza da Esri: funciona aberto de arquivo local (file://), sem chave.
  // OSM e CARTO recusam pedido sem Referer, que e o caso do ranking.html baixado.
  const canvas = escuro ? "World_Dark_Gray_Base" : "World_Light_Gray_Base";
  L.tileLayer(`https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/${canvas}/MapServer/tile/{z}/{y}/{x}`, {
    maxZoom: 16,
    attribution: "Mapa © Esri, HERE, Garmin, © OpenStreetMap",
  }).addTo(mapa);

  const meio = D.mapa.passo / 2;
  celulas = D.mapa.pontos.map(([la, lo]) =>
    L.rectangle([[la - meio, lo - meio], [la + meio, lo + meio]],
                {stroke: false, fillOpacity: 0, interactive: false}).addTo(mapa));

  const praias = D.dias[0].grupos.flatMap(g => g.praias);
  marcadores = praias.map(p => {
    const m = L.circleMarker([p.lat, p.lon], {radius: 6, color: "#ffffff", weight: 2, fillOpacity: 1})
      .bindTooltip("", {direction: "top", offset: [0, -6]})
      .on("click", () => selecionarPraia(p.nome))
      .addTo(mapa);
    m.praia = p.nome;
    return m;
  });
  mapa.fitBounds(L.latLngBounds(praias.map(p => [p.lat, p.lon])).pad(0.12));
  renderLegendaMapa();
}

function renderLegendaMapa() {
  const e = ESCALAS[metrica];
  $("#legenda-mapa").innerHTML = `<span>${e.titulo}</span>` +
    e.rotulos.map((r, i) => `<span><i style="background:${e.cores[i]}"></i>${r}</span>`).join("") +
    `<span><i style="background:${COR_FAIXA.sol}"></i>praia com sol</span>` +
    `<span><i style="background:${COR_FAIXA.nublado}"></i>nublado</span>` +
    `<span><i style="background:${COR_FAIXA.chuva}"></i>chuva</span>`;
}

function pintarMapa() {
  if (!mapa) return;
  const d = D.dias[diaSel], md = D.mapa.dias[d.data];
  if (!md) return;
  if (horaMapa == null) horaMapa = Math.max(0, md.h.indexOf(12));
  horaMapa = Math.min(horaMapa, md.h.length - 1);

  const valores = md[metrica][horaMapa];
  celulas.forEach((c, i) => {
    const cor = corDaChuva(valores[i]);
    c.setStyle({fillColor: cor || "#000000", fillOpacity: cor ? 0.55 : 0});
  });

  const grupoDe = {};
  d.grupos.forEach(g => g.praias.forEach(p => { grupoDe[p.nome] = g; }));
  marcadores.forEach(m => {
    const g = grupoDe[m.praia], f = FAIXA[g.faixa];
    m.setStyle({fillColor: COR_FAIXA[g.faixa]});
    m.setTooltipContent(`<b>${esc(m.praia)}</b> · ${f.icone} ${f.rotulo} ${g.score}`);
  });

  $("#hora").max = md.h.length - 1;
  $("#hora").value = horaMapa;
  $("#hora-rotulo").textContent = `${md.h[horaMapa]}h`;
}

// Mapa e graficos andam juntos: a hora escolhida num aparece no outro.
function irParaHora(i) {
  horaMapa = i;
  pintarMapa();
  marcarHora(i);
}

function selecionarPraia(nome) {
  const i = D.dias[diaSel].grupos.findIndex(g => g.praias.some(p => p.nome === nome));
  if (i < 0) return;
  grupoSel = i;
  document.querySelectorAll(".grupo").forEach(b => b.setAttribute("aria-pressed", +b.dataset.i === i));
  renderGraficos();
  if (horaMapa != null) marcarHora(horaMapa);
}

function alternarAnimacao() {
  const botao = $("#tocar");
  if (animacao) {
    clearInterval(animacao); animacao = null;
    botao.textContent = "▶"; botao.setAttribute("aria-label", "Animar as horas");
    return;
  }
  botao.textContent = "❚❚"; botao.setAttribute("aria-label", "Pausar");
  animacao = setInterval(() => {
    const total = D.mapa.dias[D.dias[diaSel].data].h.length;
    irParaHora((horaMapa + 1) % total);
  }, 700);
}

// ─── tabela (todos os valores, sem depender do hover) ─────────────────────
function renderTabela() {
  const linhas = D.dias[diaSel].grupos.flatMap(g => g.praias.map(p => ({p, g})));
  $("#tabela").innerHTML = `<table><thead><tr><th>Praia</th><th>Região</th><th>Score</th><th>Manhã</th><th>Tarde</th>
    <th>Chuva máx</th><th>mm</th><th>Nuvens</th><th>Vento</th><th>Máx</th><th>UV</th></tr></thead><tbody>` +
    linhas.map(({p, g}) => `<tr><td>${esc(p.nome)}</td><td>${esc(p.regiao)}</td><td><b>${g.score}</b></td>
      <td>${fmt(g.manha)}</td><td>${fmt(g.tarde)}</td><td>${fmt(g.chuva_prob_max, "%")}</td><td>${fmt(g.chuva_mm, "", 1)}</td>
      <td>${fmt(g.nuvens, "%")}</td><td>${fmt(g.vento, " km/h")}</td><td>${fmt(p.temp_max, "°")}</td><td>${fmt(g.uv_max)}</td></tr>`).join("") +
    `</tbody></table>`;
}

// ─── montagem ─────────────────────────────────────────────────────────────
function iniciar() {
  const primeiro = D.dias[0], ultimo = D.dias[D.dias.length - 1];
  $("#titulo").textContent = `Sol nas praias de ${D.cidade}`;
  $("#periodo").textContent =
    `Previsão de ${primeiro.semana.slice(0, 3)} ${primeiro.dm} a ${ultimo.semana.slice(0, 3)} ${ultimo.dm} · atualizada em ${D.gerado}`;
  $("#rodape").innerHTML =
    `Score de sol de 0 a 100 no horário de praia (9h–17h): chance de chuva 40% · nuvens 35% · chuva em mm 15% · vento 10%. ` +
    `☀️ sol a partir de ${D.faixa_sol} · ⛅ nublado a partir de ${D.faixa_nublado} · 🌧️ chuva abaixo disso.<br>` +
    `Praias na mesma linha recebem a mesma previsão: o modelo tem grade de ~10–25 km, então vizinhas caem no mesmo ponto. ` +
    `Previsão Open-Meteo.`;

  $("#semana").addEventListener("click", e => {
    const b = e.target.closest(".dia");
    if (!b) return;
    diaSel = +b.dataset.i; grupoSel = 0;
    renderSemana(); renderDia();
  });
  $("#ranking").addEventListener("click", e => {
    const b = e.target.closest(".grupo");
    if (!b) return;
    grupoSel = +b.dataset.i;
    document.querySelectorAll(".grupo").forEach(x => x.setAttribute("aria-pressed", x === b));
    renderGraficos();
  });
  const graficos = $("#graficos");
  graficos.addEventListener("pointermove", e => { const i = horaDoPonteiro(e); if (i != null) irParaHora(i); });
  graficos.addEventListener("pointerdown", e => { const i = horaDoPonteiro(e); if (i != null) irParaHora(i); });
  graficos.addEventListener("pointerleave", () => marcarHora(null));

  $("#hora").addEventListener("input", e => irParaHora(+e.target.value));
  $("#tocar").addEventListener("click", alternarAnimacao);
  document.querySelectorAll("[data-metrica]").forEach(b => b.addEventListener("click", () => {
    metrica = b.dataset.metrica;
    document.querySelectorAll("[data-metrica]").forEach(x => x.setAttribute("aria-pressed", x === b));
    renderLegendaMapa();
    pintarMapa();
  }));
  let espera;
  addEventListener("resize", () => { clearTimeout(espera); espera = setTimeout(renderGraficos, 150); });

  // ?dia=N abre direto no dia N (0 = amanha): link compartilhavel.
  const pedido = +new URLSearchParams(location.search).get("dia");
  if (pedido > 0 && pedido < D.dias.length) diaSel = pedido;

  iniciarMapa();
  renderSemana();
  renderDia();
}

async function carregar() {
  const url = `${FONTE.url}/rest/v1/painel_praias?select=dados&cidade=eq.${encodeURIComponent(FONTE.cidade)}`;
  const resposta = await fetch(url, {headers: {apikey: FONTE.chave, Authorization: `Bearer ${FONTE.chave}`}});
  if (!resposta.ok) throw new Error(`HTTP ${resposta.status}`);
  const linhas = await resposta.json();
  if (!linhas.length) throw new Error("ainda não há previsão gravada");
  return linhas[0].dados;
}

(async () => {
  if (!D) {
    $("#titulo").textContent = "Sol nas praias";
    $("#periodo").textContent = "Carregando a previsão…";
    try {
      D = await carregar();
    } catch (e) {
      $("#periodo").textContent = `Não deu para carregar a previsão (${e.message}). Tente de novo em instantes.`;
      document.querySelectorAll(".card").forEach(c => c.hidden = true);
      return;
    }
  }
  iniciar();
})();
</script>
</body>
</html>
